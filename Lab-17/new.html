
<!DOCTYPE html>
<html>
<head>
    <title>Responsive Navigation Bar</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        .navbar {
            background-color: #333;
            overflow: hidden;
        }

        .navbar a {
            float: left;
            color: white;
            padding: 15px 20px;
            text-decoration: none;
            font-size: 18px;
        }

        .navbar a:hover {
            background-color: #04AA6D;
        }

        .menu-icon {
            display: none;
            color: white;
            font-size: 25px;
            padding: 12px 20px;
            cursor: pointer;
        }

        .content {
            padding: 20px;
            text-align: center;
        }

        @media screen and (max-width: 600px) {
            .navbar a {
                float: none;
                display: none;
                text-align: left;
            }

            .navbar a.show {
                display: block;
            }

            .menu-icon {
                display: block;
            }
        }
    </style>
</head>

<body>

    <div class="navbar">
        <span class="menu-icon" onclick="toggleMenu()">&#9776; Menu</span>

        <a href="new.html">Home</a>
        <a href="About.html">About</a>
        <a href="service.html">Services</a>
        <a href="contact.html">Contact</a>
    </div>

    <div class="content">
        <h1>Responsive Navigation Bar</h1>
        <p>Resize the browser to see the responsive menu.</p>
    </div>

    <script>
        function toggleMenu() {
            var links = document.querySelectorAll(".navbar a");

            links.forEach(function(link) {
                link.classList.toggle("show");
            });
        }
    </script>

</body>
</html>
