<!DOCTYPE html>
<html>
<head>
    <title>Different Shapes</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
        }

        .shape {
            margin: 30px auto;
        }

        /* Square */
        .square {
            width: 150px;
            height: 150px;
            background-color: red;
        }

        /* Rectangle */
        .rectangle {
            width: 250px;
            height: 120px;
            background-color: blue;
        }

        /* Circle */
        .circle {
            width: 150px;
            height: 150px;
            background-color: green;
            border-radius: 50%;
        }

        /* Oval */
        .oval {
            width: 250px;
            height: 120px;
            background-color: orange;
            border-radius: 50%;
        }

        /* Triangle */
        .triangle {
            width: 0;
            height: 0;
            border-left: 100px solid transparent;
            border-right: 100px solid transparent;
            border-bottom: 180px solid purple;
        }

        /* Diamond */
        .diamond {
            width: 120px;
            height: 120px;
            background-color: pink;
            transform: rotate(45deg);
        }
    </style>
</head>

<body>

    <h1>Different Shapes Using HTML and CSS</h1>

    <h2>Square</h2>
    <div class="shape square"></div>

    <h2>Rectangle</h2>
    <div class="shape rectangle"></div>

    <h2>Circle</h2>
    <div class="shape circle"></div>

    <h2>Oval</h2>
    <div class="shape oval"></div>

    <h2>Triangle</h2>
    <div class="shape triangle"></div>

    <h2>Diamond</h2>
    <div class="shape diamond"></div>

</body>
</html>
