<!DOCTYPE html>
<html>
<head>
    <title>Service Page</title>

    <style>
        body{
            font-family: Arial;
            text-align: center;
            background-color: #f4f4f4;
        }

        .service{
            margin-top: 50px;
        }

        summary{
            background-color: blue;
            color: white;
            padding: 15px;
            width: 200px;
            margin: auto;
            cursor: pointer;
            list-style: none;
            border-radius: 5px;
        }

        summary:hover{
            background-color: darkblue;
        }

        p{
            background-color: white;
            width: 500px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <h1>My Website</h1>

    <div class="service">
        <details>
            <summary>Services</summary>

            <p>
                We provide Web Design, Web Development and Digital Marketing services.
                Our services help customers create attractive websites and grow their business online.
            </p>

        </details>
    </div>

</body>
</html>
