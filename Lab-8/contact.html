<!DOCTYPE html>
<html>
<head>
    <title>Contact Us</title>

    <style>
        body{
            font-family: Arial;
            text-align: center;
            background-color: #f4f4f4;
        }

        .contact{
            background-color: white;
            width: 500px;
            margin: 50px auto;
            padding: 25px;
            border-radius: 10px;
        }

        input, textarea{
            width: 90%;
            padding: 10px;
            margin: 10px;
        }

        input[type="submit"]{
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Contact Us</h1>

    <div class="contact">
        <p>For any inquiry, please contact us.</p>

        <form>
            <input type="text" placeholder="Enter Your Name"><br>

            <input type="email" placeholder="Enter Your Email"><br>

            <textarea placeholder="Enter Your Message"></textarea><br>

            <input type="submit" value="Send Message">
        </form>
    </div>

    <a href="index.html">Back to Home</a>

</body>
</html>
