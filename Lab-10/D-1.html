```html
<!DOCTYPE html>
<html>
<head>
    <title>Z-Index</title>
    <style>
        .box1 {
            width: 150px;
            height: 150px;
            background: red;
            position: absolute;
            left: 50px;
            top: 50px;
            z-index: 1;
        }

        .box2 {
            width: 150px;
            height: 150px;
            background: blue;
            position: absolute;
            left: 100px;
            top: 100px;
            z-index: 2;
        }

        .box3 {
            width: 150px;
            height: 150px;
            background: green;
            position: absolute;
            left: 150px;
            top: 150px;
            z-index: 3;
        }
    </style>
</head>
<body>

    <h2>Use of Z-Index</h2>

    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box3"></div>

</body>
</html>
