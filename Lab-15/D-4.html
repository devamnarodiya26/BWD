<!DOCTYPE html>
<html>
<head>
    <title>Bootstrap Grid Table</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">
    <h2 class="text-center">Student Details</h2>

    <div class="row bg-dark text-white p-2">
        <div class="col">ID</div>
        <div class="col">Name</div>
        <div class="col">Course</div>
        <div class="col">City</div>
    </div>

    <div class="row border p-2">
        <div class="col">1</div>
        <div class="col">Keval</div>
        <div class="col">BCA</div>
        <div class="col">Rajkot</div>
    </div>

    <div class="row border p-2">
        <div class="col">2</div>
        <div class="col">Rahul</div>
        <div class="col">BCA</div>
        <div class="col">Ahmedabad</div>
    </div>

    <div class="row border p-2">
        <div class="col">3</div>
        <div class="col">Amit</div>
        <div class="col">BCA</div>
        <div class="col">Surat</div>
    </div>

</div>

</body>
</html>
